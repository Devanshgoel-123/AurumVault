[package]
name = "aurumvault"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = ">=2.16.1"
openzeppelin = "3.0.0"

[[target.starknet-contract]]
casm = true

[dev-dependencies]
snforge_std = "0.58.0"

[profile.dev.cairo]
unstable-add-statements-functions-debug-info = true
unstable-add-statements-code-locations-debug-info = true
panic-backtrace = true
inlining-strategy= "avoid"

[[tool.snforge.fork]]
name = "SEPOLIA"
url = "https://starknet-sepolia.g.alchemy.com/starknet/version/rpc/v0_10/xeuGiQZ_9pTxu2oD9AMPV"
block_id.number = "8083665"

[profile.release.cairo]
sierra-replace-ids = true